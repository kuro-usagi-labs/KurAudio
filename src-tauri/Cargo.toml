[package]
name = "kuraudio"
version = "0.11.0"
edition = "2021"
description = "Local multitrack audio editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hound = "3.5"
symphonia = { version = "0.5.5", features = ["all"] }
tempfile = "3"

[profile.release]
strip = true
lto = false
codegen-units = 16
opt-level = "s"

